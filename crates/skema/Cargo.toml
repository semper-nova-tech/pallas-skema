[package]
name = "skema"
version = "0.2.1"
edition = "2021"
description = "Pallas Skema: validate, render, and open the terminal Editor for agent-native diagrams"
repository = "https://github.com/semper-nova-tech/pallas-skema"
homepage = "https://github.com/semper-nova-tech/pallas-skema"
license = "MIT"

[[bin]]
name = "skema"
path = "src/main.rs"

[lib]
name = "skema"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skema-core = { path = "../skema-core" }
skema-tui = { path = "../skema-tui" }
